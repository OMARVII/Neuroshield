<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>NeuroShield</title>
  <link rel="stylesheet" href="../ui/tokens.css">
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <main class="popup" id="popup" data-state="loading">
    <header class="top">
      <div class="brand">
        <img src="../../icons/icon-32.png" width="20" height="20" alt="">
        <span>NeuroShield</span>
      </div>
      <button class="icon-button" id="openOptions" type="button" aria-label="Settings" title="Settings">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M4 7h10M18 7h2M4 17h4M12 17h8"/>
          <circle cx="16" cy="7" r="2"/>
          <circle cx="10" cy="17" r="2"/>
        </svg>
      </button>
    </header>

    <section class="hero">
      <div class="hero-mark" aria-hidden="true">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 3 5 5.8v5.6c0 4.3 2.9 7.9 7 9.6 4.1-1.7 7-5.3 7-9.6V5.8L12 3Z"/>
          <path d="M8.5 12.3l1.6-2.3 1.9 3.9 1.4-2.2h2.1"/>
        </svg>
      </div>
      <div class="hero-text" aria-live="polite">
        <h1 id="heroTitle">NeuroShield</h1>
        <p id="heroDetail">&nbsp;</p>
      </div>
      <label class="switch" title="Protection on all sites">
        <input type="checkbox" id="enabled" role="switch" aria-label="Protection on all sites">
        <span class="track"><span class="thumb"></span></span>
      </label>
    </section>

    <button class="button wide" id="protectTab" type="button" hidden>Turn on for this tab</button>

    <section class="panel" id="sitePanel" hidden>
      <div class="row">
        <div class="row-text">
          <span class="row-title">On this site</span>
          <span class="row-sub" id="siteHost"></span>
        </div>
        <label class="switch small">
          <input type="checkbox" id="siteEnabled" role="switch" aria-label="Protection on this site">
          <span class="track"><span class="thumb"></span></span>
        </label>
      </div>
    </section>

    <section class="panel" id="sensitivityPanel">
      <span class="row-title" id="sensitivityLabel">Sensitivity</span>
      <div class="segmented" id="sensitivity" role="radiogroup" aria-labelledby="sensitivityLabel">
        <button type="button" role="radio" data-value="low">Low</button>
        <button type="button" role="radio" data-value="medium">Medium</button>
        <button type="button" role="radio" data-value="high">High</button>
        <button type="button" role="radio" data-value="maximum">Max</button>
      </div>
      <p class="hint" id="sensitivityHint"></p>
    </section>

    <section class="stats" aria-label="Activity">
      <div class="stat">
        <span class="stat-value" id="pageCount">0</span>
        <span class="stat-label">Hidden on this page</span>
      </div>
      <div class="stat">
        <span class="stat-value" id="totalCount">0</span>
        <span class="stat-label">Hidden in total</span>
      </div>
    </section>

    <button class="hide-page" id="hidePage" type="button">
      <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M3 3l18 18"/>
        <path d="M10.6 5.1A9.8 9.8 0 0 1 12 5c5 0 8.5 4.4 9.5 7-.4 1-1.2 2.4-2.4 3.7"/>
        <path d="M6.4 6.5C4.6 7.8 3.2 9.7 2.5 12c1 2.6 4.5 7 9.5 7 1.7 0 3.3-.5 4.6-1.3"/>
        <path d="M9.9 9.9a3 3 0 0 0 4.2 4.2"/>
      </svg>
      <span id="hidePageLabel">Hide everything on this page</span>
      <kbd id="shortcut" aria-hidden="true" hidden></kbd>
    </button>
  </main>
  <script src="../shared/settings.js"></script>
  <script src="popup.js"></script>
</body>
</html>
